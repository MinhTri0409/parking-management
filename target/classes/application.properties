# ===== Kết nối MySQL (tự tạo database parking_management nếu chưa có) =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/parking_management?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ===== JPA / Hibernate =====
# update: tự tạo và cập nhật bảng theo các lớp entity
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false

# ===== Giao diện Thymeleaf =====
# Tắt cache để sửa file html xong chỉ cần tải lại trang
spring.thymeleaf.cache=false

# ===== Email liên hệ (cấu hình SMTP qua biến môi trường) =====
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
app.contact.email=${CONTACT_EMAIL:trantridung10122006@gmail.com}
app.contact.from=${CONTACT_FROM:}

# ===== Server =====
server.port=8080
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
